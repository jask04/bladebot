name: Fly Deploy

on:
  push:
    branches:
      - master # or main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install and Deploy to Fly.io
        run: |
          curl -L https://fly.io/install.sh | sh
          /home/runner/.fly/bin/flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}