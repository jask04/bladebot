app = 'bladebot'
primary_region = 'sjc'

[build]

[processes]
  app = 'npm start'

[[mounts]]
  source = 'bladebot_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[[vm]]
