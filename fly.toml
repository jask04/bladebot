# fly.toml app configuration file generated for bladebot on 2025-11-22T19:01:34-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bladebot'
primary_region = 'sjc'

[build]

[processes]
  app = 'node ./dbsetup.js npm start'

[[mounts]]
  source = 'bladebot_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
